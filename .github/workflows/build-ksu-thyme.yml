name: Build KernelSU thyme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git \
            libncurses-dev libssl-dev libxml2-utils lz4 python3 zip unzip libelf-dev device-tree-compiler

      - name: Setup zyc-clang 16
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          curl -L --retry 3 -o clang.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxf clang.tar.gz
          $HOME/zyc-clang/bin/clang --version | head -2

      - name: Clone pure LineageOS kernel
        run: |
          git clone --depth 1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8250 kernel

      - name: Integrate official KernelSU v0.9.5
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          ls -l drivers/kernelsu
          grep -n "CONFIG_KSU" drivers/Makefile drivers/Kconfig | head
          # KernelSU 的 setup 改动了 tracked 文件，会让 setlocalversion 追加 -dirty，
          # 导致 vermagic 与官方内核不一致（vendor 模块拒载）。这里去掉该后缀。
          sed -i 's/"-dirty"/""/' scripts/setlocalversion
          grep -n 'dirty' scripts/setlocalversion || true

      - name: Configure
        working-directory: kernel
        run: |
          export PATH=$HOME/zyc-clang/bin:$PATH
          make_args=(-j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" HOSTCC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          make "${make_args[@]}" vendor/kona-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/thyme.config
          scripts/config --file out/.config \
            -e KSU -e KPROBES -e KPROBE_EVENTS -e KALLSYMS -e KALLSYMS_ALL -e MODULES -e EXT4_FS
          make "${make_args[@]}" olddefconfig
          echo "--- 关键配置校验 ---"
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KALLSYMS_ALL|MODULES|EXT4_FS)=" out/.config
          for s in KSU KPROBES KPROBE_EVENTS; do
            grep -q "^CONFIG_${s}=y" out/.config || { echo "缺少 CONFIG_${s}=y，停止"; exit 1; }
          done

      - name: Verify kernel release string
        working-directory: kernel
        run: |
          export PATH=$HOME/zyc-clang/bin:$PATH
          make_args=(-j"$(nproc)" O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" HOSTCC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          VER=$(make "${make_args[@]}" kernelrelease 2>/dev/null | tail -1)
          EXPECT="4.19.325-cip131-st15-perf-g71b13e62f057"
          echo "kernelrelease = $VER"
          echo "expected      = $EXPECT"
          if [ "$VER" != "$EXPECT" ]; then
            echo "::error::版本串不一致，vendor 模块会因 vermagic 拒载"
            exit 1
          fi

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH=$HOME/zyc-clang/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" HOSTCC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/dtb || true

      - name: Pack AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          sed -i 's/^device.name1=.*/device.name1=thyme/' ak3/anykernel.sh
          grep -q '^device.name1=thyme' ak3/anykernel.sh || echo 'device.name1=thyme' >> ak3/anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=LineageOS 23.2 + KernelSU v0.9.5/' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          if [ -f kernel/out/arch/arm64/boot/dtb ]; then cp kernel/out/arch/arm64/boot/dtb ak3/dtb; fi
          cd ak3 && zip -r9 ../KernelSU-thyme-ak3.zip . -x '.git/*' > /dev/null
          cd .. && ls -lh KernelSU-thyme-ak3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-thyme-ak3
          path: |
            KernelSU-thyme-ak3.zip
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtb
          if-no-files-found: warn
